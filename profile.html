<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#2c3e50">
  
  <title>Profil Saya - BMpro</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>

  <div class="mobile-shell">
  
  <div class="profile-page">
    <!-- Header -->
    <div class="profile-header">
      <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <h2>👤 Profil Saya</h2>
    </div>
    
    <!-- Konten -->
    <div class="profile-content">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <div class="profile-name" id="profileName">-</div>
        <div class="profile-phone" id="profilePhone">-</div>
      </div>
      
      <div class="profile-info">
        <div class="spec-item">
          <span class="spec-label">Status</span>
          <span class="spec-value" style="color: #27ae60;">✅ Terdaftar</span>
        </div>
        <div class="spec-item" style="align-items:center;">
          <span class="spec-label">Notifikasi WhatsApp</span>
        
          <label class="switch">
            <input type="checkbox" id="notifToggle" onchange="toggleNotification()">
            <span class="slider"></span>
          </label>
        </div>
        
        <div class="spec-item">
          <span class="spec-label">Keterangan</span>
          <span class="spec-value" id="notifStatusText" style="font-size: 0.7rem; color: #888;">
            Anda akan menerima notifikasi listing baru
          </span>
        </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- ========== BOTTOM NAVIGATION ========== -->
<nav class="home-fixed-nav" aria-label="Navigasi utama">
  <a href="index.html" class="nav-item" id="navHome">
    <i class="fas fa-home"></i>
    <span>Beranda</span>
  </a>
  <a href="search.html" class="nav-item" id="navSearch">
    <i class="fas fa-search"></i>
    <span>Cari</span>
  </a>
  <a href="#" class="nav-item" id="navFavorite" onclick="goToFavorite(event)">
    <i class="fas fa-heart"></i>
    <span>Favorit</span>
  </a>
  <a href="#" class="nav-item" id="navProfile" onclick="goToProfile(event)">
    <i class="fas fa-user"></i>
    <span>Profil</span>
  </a>
</nav>

  <script src="js/script.js"></script>
  
  <script>
    const API_URL ='https://script.google.com/macros/s/AKfycbw9P0EarrVJjrYOtvvAbveyUoFrH8rN2re-zkcx25DBrjshpjJ5Qsd7U2U7xb8dkO5q/exec';
    // ========== LOAD PROFIL ==========
    function loadProfile() {
      const userData = JSON.parse(localStorage.getItem('bmpro_user') || 'null');
      
      if (!userData) {
        window.location.href = 'register.html';
        return;
      }
      
      document.getElementById('profileName').textContent = userData.nama || '-';
      document.getElementById('profilePhone').textContent = userData.kontak || '-';
      
      // Set avatar (huruf pertama nama)
      const initial = (userData.nama || 'U').charAt(0).toUpperCase();
      document.getElementById('profileAvatar').textContent = initial;
    }


    // ============================================================
// NAVIGASI FUNCTIONS
// ============================================================

function goToFavorite(event) {
  if (event) event.preventDefault();
  const userData = JSON.parse(localStorage.getItem('bmpro_user') || 'null');
  if (!userData) {
    window.location.href = 'register.html';
  } else {
    window.location.href = 'favorite.html';
  }
}

function goToProfile(event) {
  if (event) event.preventDefault();
  const userData = JSON.parse(localStorage.getItem('bmpro_user') || 'null');
  if (!userData) {
    window.location.href = 'register.html';
  } else {
    window.location.href = 'profile.html';
  }
}

// ============================================================
// SET ACTIVE NAV (Otomatis sesuai halaman)
// ============================================================
function setActiveNav() {
  const page = window.location.pathname.split('/').pop() || 'index.html';
  const map = {
    'index.html': 'navHome',
    'search.html': 'navSearch',
    'favorite.html': 'navFavorite',
    'profile.html': 'navProfile',
    'register.html': 'navHome'
  };
  const el = document.getElementById(map[page]);
  if (el) el.classList.add('active');
}

// Jalankan saat halaman dimuat
document.addEventListener('DOMContentLoaded', setActiveNav);
    
    function doLogout() {
        if (confirm('⚠️ Jika Anda Logout, maka listing properti Favorite akan terhapus.\n\nApakah Anda yakin ingin logout?')) {
            // Hapus data user DAN favorit dari localStorage
            localStorage.removeItem('bmpro_user');
            localStorage.removeItem('bmpro_favorites');
            
            alert('Anda telah logout. Silakan registrasi lagi untuk mengakses fitur favorit dan profil.');
            window.location.href = 'index.html';
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadNotificationSetting();
    });


    // ========== TOGGLE NOTIF ==========
  async function toggleNotif(status) {

  const userData =
    JSON.parse(
      localStorage.getItem('bmpro_user')
    );

  try {

    const formData = new FormData();

    formData.append('action', 'updateNotif');
    formData.append('kontak', userData.kontak);
    formData.append('notif', status);

    const response = await fetch(API_URL, {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (result.success) {

      // update localStorage
      userData.notif = status;

      localStorage.setItem(
        'bmpro_user',
        JSON.stringify(userData)
      );

      localStorage.setItem(
        'bmpro_notification',
        status
      );

    } else {

      alert(result.message);

    }

  } catch(error) {

    alert('Gagal update notif');

    console.log(error);

  }

}

document.addEventListener(
'DOMContentLoaded',
loadProfile
);

function loadNotificationSetting() {

const userData =
  JSON.parse(
    localStorage.getItem('bmpro_user')
  );

const notif =
  userData?.notif || 'on';

const isEnabled =
  notif === 'on';

document.getElementById(
  'notifToggle'
).checked = isEnabled;

updateNotificationText(isEnabled);

}

async function toggleNotification() {

const toggle =
  document.getElementById('notifToggle');

const enabled =
  toggle.checked;

const status =
  enabled ? 'on' : 'off';

// disable toggle saat loading
toggle.disabled = true;

// tampilkan loading text
const text =
  document.getElementById('notifStatusText');

text.textContent =
  '⏳ Menyimpan pengaturan...';

try {

  // update server
  await toggleNotif(status);

  // update tampilan
  updateNotificationText(enabled);

} catch(error) {

  // rollback toggle jika gagal
  toggle.checked = !enabled;

  alert(
    '❌ Gagal menyimpan pengaturan'
  );

  console.log(error);

}

// aktifkan kembali toggle
toggle.disabled = false;

}

function updateNotificationText(enabled) {

  const text =
    document.getElementById(
      'notifStatusText'
    );

  if (enabled) {

    text.textContent =
      '🔔 Anda akan menerima notifikasi listing baru';

  } else {

    text.textContent =
      '🔕 Notifikasi listing baru dimatikan';

  }
}
  </script>
</body>
</html>
